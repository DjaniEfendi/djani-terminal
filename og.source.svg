<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="vig" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#ffb000" stop-opacity="0.075"/>
      <stop offset="100%" stop-color="#ffb000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" fill-opacity="0"/>
      <rect y="2" width="4" height="2" fill="#000000" fill-opacity="0.16"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#0b0a07"/>
  <rect width="1200" height="630" fill="url(#vig)"/>

  <!-- terminal window -->
  <rect x="90" y="80" width="1020" height="470" rx="10" fill="#ffb000" fill-opacity="0.02"
        stroke="#ffb000" stroke-opacity="0.35" stroke-width="2"/>
  <rect x="90" y="80" width="1020" height="52" rx="10" fill="#ffb000" fill-opacity="0.05"/>
  <line x1="90" y1="132" x2="1110" y2="132" stroke="#ffb000" stroke-opacity="0.25" stroke-width="2"/>
  <circle cx="122" cy="106" r="6" fill="#ffb000" fill-opacity="0.32"/>
  <circle cx="144" cy="106" r="6" fill="#ffb000" fill-opacity="0.32"/>
  <circle cx="166" cy="106" r="6" fill="#ffb000" fill-opacity="0.32"/>
  <text x="196" y="112" font-family="Menlo" font-size="19" fill="#8f7a3a">djani@efendi — ~/terminal — 80×24</text>

  <!-- banner box -->
  <rect x="140" y="180" width="640" height="150" fill="none" stroke="#ffb000" stroke-opacity="0.65" stroke-width="2"/>
  <text x="176" y="248" font-family="Menlo" font-weight="700" font-size="52" letter-spacing="4" fill="#ffd75e">DJANI TERMINAL</text>
  <text x="178" y="296" font-family="Menlo" font-size="24" fill="#8f7a3a">personal index — v1.0</text>

  <!-- body lines -->
  <text x="140" y="382" font-family="Menlo" font-size="26" fill="#ffb000">Djani Efendi — Private Equity Associate, Centricus</text>
  <text x="140" y="422" font-family="Menlo" font-size="22" fill="#8f7a3a">technology and AI infrastructure · London</text>

  <!-- prompt line -->
  <text x="140" y="492" font-family="Menlo" font-size="26" fill="#7dff9a">djani@terminal:~$</text>
  <text x="421" y="492" font-family="Menlo" font-size="26" fill="#ffb000">whoami</text>
  <rect x="524" y="470" width="15" height="28" fill="#ffb000"/>

  <rect width="1200" height="630" fill="url(#scan)"/>
</svg>
